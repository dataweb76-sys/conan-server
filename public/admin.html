<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin · Dragones y Demonios</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cinzel:wght@400;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    :root {
      --c-bg:       #0a0705;
      --c-card:     rgba(12, 7, 4, 0.97);
      --c-gold:     #c9861c;
      --c-gold-l:   #e8a830;
      --c-gold-dim: #6a4010;
      --c-text:     #e8d5a3;
      --c-dim:      #8a7050;
      --c-border:   rgba(150,90,15,0.32);
      --c-border-h: rgba(220,155,30,0.65);
      --glow:       0 0 28px rgba(200,134,28,0.4);
      --f-d: 'Cinzel Decorative', Georgia, serif;
      --f-h: 'Cinzel', Georgia, serif;
      --f-b: 'EB Garamond', Georgia, serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--c-bg);
      color: var(--c-text);
      font-family: var(--f-b);
      font-size: 1.05rem;
      min-height: 100vh;
    }
    .bg {
      position: fixed; inset: 0; z-index: -1;
      background:
        radial-gradient(ellipse 70% 40% at 50% 90%, rgba(200,70,0,0.25) 0%, transparent 60%),
        linear-gradient(to bottom, #050304 0%, #0d0603 20%, #1a0a04 50%, #0a0603 100%);
    }

    /* ── Header ── */
    .site-header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(6,3,2,0.92);
      border-bottom: 1px solid var(--c-border);
      backdrop-filter: blur(20px);
      padding: 0.65rem 0;
    }
    .header-inner {
      width: 90%; max-width: 960px; margin: 0 auto;
      display: flex; align-items: center; justify-content: space-between; gap: 1rem;
    }
    .header-brand { display: flex; flex-direction: column; text-decoration: none; }
    .brand-sub {
      font-family: var(--f-h); font-size: 0.58rem;
      letter-spacing: 0.2em; text-transform: uppercase; color: var(--c-gold-dim);
    }
    .brand-name {
      font-family: var(--f-d); font-size: 1.05rem;
      color: var(--c-gold-l); text-shadow: var(--glow); line-height: 1.1;
    }
    .btn-donate-nav {
      display: inline-flex; align-items: center; gap: 0.5rem;
      padding: 0.42rem 1.1rem; border-radius: 20px;
      background: linear-gradient(135deg, rgba(180,30,10,0.25), rgba(180,50,0,0.16));
      border: 1px solid rgba(220,60,20,0.45); color: #ffaa88;
      font-family: var(--f-h); font-size: 0.7rem; letter-spacing: 0.1em;
      cursor: pointer; transition: all 0.25s;
      animation: donate-border-pulse 2.8s ease-in-out infinite;
    }
    .btn-donate-nav:hover {
      background: linear-gradient(135deg, rgba(200,40,20,0.35), rgba(200,65,0,0.22));
      box-shadow: 0 0 22px rgba(220,60,0,0.45); color: #ffaa88; animation: none;
    }
    @keyframes donate-border-pulse {
      0%, 100% { box-shadow: 0 0 6px rgba(220,60,0,0.2); border-color: rgba(220,60,20,0.45); }
      50%      { box-shadow: 0 0 20px rgba(220,60,0,0.55), 0 0 40px rgba(220,60,0,0.18); border-color: rgba(220,80,40,0.7); }
    }
    .donate-nav-dot {
      display: inline-block; width: 6px; height: 6px; border-radius: 50%;
      background: #ff6644; box-shadow: 0 0 6px #ff6644; flex-shrink: 0;
      animation: pulse-donate 1.8s ease-in-out infinite;
    }
    @keyframes pulse-donate {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%      { opacity: 0.55; transform: scale(0.75); }
    }
    .header-nav { display: flex; align-items: center; gap: 0.9rem; }
    .nav-link {
      font-family: var(--f-h); font-size: 0.72rem; letter-spacing: 0.08em;
      color: var(--c-dim); text-decoration: none; transition: color 0.2s;
    }
    .nav-link:hover { color: var(--c-gold); }
    .auth-nav { display: flex; align-items: center; gap: 0.55rem; }
    .nav-register {
      padding: 0.28rem 0.75rem;
      border: 1px solid var(--c-border); border-radius: 3px;
      font-family: var(--f-h); font-size: 0.72rem; letter-spacing: 0.06em;
      color: var(--c-dim); text-decoration: none; transition: all 0.2s;
      display: inline-flex; align-items: center;
    }
    .nav-register:hover { border-color: var(--c-gold-dim); color: var(--c-gold); background: rgba(200,134,28,0.12); }

    /* ── Main ── */
    .main { width: 90%; max-width: 960px; margin: 0 auto; padding: 2.5rem 0 4rem; }

    .section-title {
      font-family: var(--f-h); font-size: 0.78rem; font-weight: 700;
      letter-spacing: 0.22em; text-transform: uppercase; color: var(--c-gold);
      padding-bottom: 0.6rem; border-bottom: 1px solid var(--c-border);
      margin-bottom: 1.2rem; display: flex; align-items: center; gap: 0.7rem;
    }
    .badge {
      display: inline-flex; align-items: center; justify-content: center;
      background: rgba(200,134,28,0.15); border: 1px solid var(--c-gold-dim);
      border-radius: 20px; min-width: 1.5rem; height: 1.5rem; padding: 0 0.4rem;
      font-family: var(--f-h); font-size: 0.7rem; color: var(--c-gold);
    }
    .tabs {
      display: flex; gap: 0; margin-bottom: 1.5rem;
      border: 1px solid var(--c-border); border-radius: 6px; overflow: hidden;
      width: fit-content;
    }
    .tab {
      font-family: var(--f-h); font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase;
      padding: 0.45rem 1.1rem; cursor: pointer; background: transparent; border: none;
      color: var(--c-dim); transition: all 0.2s; border-right: 1px solid var(--c-border);
    }
    .tab:last-child { border-right: none; }
    .tab.active { background: rgba(200,134,28,0.12); color: var(--c-gold); }
    .tab:hover:not(.active) { background: rgba(255,255,255,0.03); color: var(--c-text); }

    /* ── Request cards ── */
    .req-list { display: flex; flex-direction: column; gap: 0.8rem; }
    .req-card {
      background: var(--c-card); border: 1px solid var(--c-border);
      border-radius: 8px; padding: 1.1rem 1.3rem;
      display: flex; align-items: flex-start; gap: 1.1rem;
      transition: border-color 0.2s;
    }
    .req-card:hover { border-color: var(--c-border-h); }
    .req-card.approved { border-color: rgba(68,240,112,0.3); opacity: 0.7; }
    .req-card.rejected { border-color: rgba(240,68,68,0.25); opacity: 0.55; }
    .req-card.delivered { border-color: rgba(100,160,255,0.3); opacity: 0.7; }

    .req-type-icon { font-size: 1.5rem; flex-shrink: 0; line-height: 1; padding-top: 0.15rem; }
    .req-body { flex: 1; min-width: 0; }
    .req-name {
      font-family: var(--f-h); font-size: 1rem; font-weight: 700; color: var(--c-text);
      margin-bottom: 0.25rem; display: flex; align-items: center; gap: 0.5rem;
    }
    .req-meta { font-size: 0.85rem; color: var(--c-dim); margin-bottom: 0.5rem; }
    .req-msg {
      font-size: 0.9rem; color: var(--c-text); font-style: italic;
      padding: 0.4rem 0.7rem; border-left: 2px solid var(--c-gold-dim);
      background: rgba(200,134,28,0.05); border-radius: 0 4px 4px 0;
      margin-bottom: 0.5rem;
    }
    .req-status-pill {
      display: inline-flex; align-items: center; gap: 0.3rem;
      padding: 0.15rem 0.6rem; border-radius: 20px;
      font-family: var(--f-h); font-size: 0.6rem; letter-spacing: 0.1em; text-transform: uppercase;
    }
    .pill-pending   { background: rgba(200,134,28,0.1); border: 1px solid rgba(200,134,28,0.35); color: var(--c-gold); }
    .pill-approved  { background: rgba(68,240,112,0.08); border: 1px solid rgba(68,240,112,0.3); color: #44f070; }
    .pill-rejected  { background: rgba(240,68,68,0.08); border: 1px solid rgba(240,68,68,0.25); color: #f07070; }
    .pill-delivered { background: rgba(100,160,255,0.08); border: 1px solid rgba(100,160,255,0.3); color: #80b4ff; }

    .req-actions { display: flex; gap: 0.5rem; flex-shrink: 0; align-items: flex-start; flex-direction: column; }
    .btn-approve {
      padding: 0.45rem 0.9rem; border-radius: 4px; border: none; cursor: pointer;
      font-family: var(--f-h); font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase;
      background: rgba(68,240,112,0.12); border: 1px solid rgba(68,240,112,0.35); color: #44f070;
      transition: all 0.2s; white-space: nowrap;
    }
    .btn-approve:hover { background: rgba(68,240,112,0.22); }
    .btn-approve:disabled { opacity: 0.4; cursor: default; }
    .btn-deliver {
      padding: 0.45rem 0.9rem; border-radius: 4px; cursor: pointer;
      font-family: var(--f-h); font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase;
      background: rgba(100,160,255,0.1); border: 1px solid rgba(100,160,255,0.3); color: #80b4ff;
      transition: all 0.2s; white-space: nowrap;
    }
    .btn-deliver:hover { background: rgba(100,160,255,0.2); }
    .btn-deliver:disabled { opacity: 0.4; cursor: default; }
    .btn-reject {
      padding: 0.45rem 0.9rem; border-radius: 4px; cursor: pointer;
      font-family: var(--f-h); font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase;
      background: transparent; border: 1px solid rgba(240,68,68,0.25); color: #c07070;
      transition: all 0.2s; white-space: nowrap;
    }
    .btn-reject:hover { background: rgba(240,68,68,0.08); color: #f07070; }
    .btn-reject:disabled { opacity: 0.4; cursor: default; }

    .req-feedback {
      font-family: var(--f-h); font-size: 0.72rem; margin-top: 0.3rem;
      padding: 0.3rem 0.6rem; border-radius: 3px; display: none;
    }
    .req-feedback.ok  { display: block; color: #44f070; background: rgba(68,240,112,0.08); border: 1px solid rgba(68,240,112,0.25); }
    .req-feedback.err { display: block; color: #f07070; background: rgba(240,68,68,0.08); border: 1px solid rgba(240,68,68,0.25); }
    .req-rcon {
      font-size: 0.78rem; color: var(--c-dim); font-family: monospace;
      padding: 0.3rem 0.6rem; border-radius: 3px; margin-top: 0.4rem;
      background: rgba(0,0,0,0.3); border: 1px solid rgba(100,80,40,0.3);
      word-break: break-all; max-width: 400px;
    }
    .btn-secondary-sm {
      padding: 0.35rem 0.7rem; border-radius: 4px; cursor: pointer;
      font-family: var(--f-h); font-size: 0.65rem; letter-spacing: 0.08em; text-transform: uppercase;
      background: transparent; border: 1px solid var(--c-border); color: var(--c-dim);
      transition: all 0.2s; white-space: nowrap;
    }
    .btn-secondary-sm:hover { border-color: var(--c-gold-dim); color: var(--c-gold); }
    .btn-secondary-sm:disabled { opacity: 0.4; cursor: default; }

    .empty-state {
      padding: 3rem 1rem; text-align: center;
      color: var(--c-dim); font-style: italic; font-size: 1rem;
    }
    .refresh-bar {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 1rem;
    }
    .last-refresh { font-family: var(--f-h); font-size: 0.68rem; letter-spacing: 0.05em; color: var(--c-dim); }
    .btn-refresh {
      font-family: var(--f-h); font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase;
      padding: 0.3rem 0.75rem; background: transparent; border: 1px solid var(--c-border);
      border-radius: 3px; color: var(--c-dim); cursor: pointer; transition: all 0.2s;
    }
    .btn-refresh:hover { border-color: var(--c-gold-dim); color: var(--c-gold); }

    /* ── Market management ── */
    .market-toolbar {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 1rem; flex-wrap: wrap; gap: 0.5rem;
    }
    .btn-add-item {
      font-family: var(--f-h); font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase;
      padding: 0.4rem 1rem; background: rgba(200,134,28,0.12);
      border: 1px solid var(--c-gold-dim); border-radius: 4px;
      color: var(--c-gold); cursor: pointer; transition: all 0.2s;
    }
    .btn-add-item:hover { background: rgba(200,134,28,0.22); }
    .item-grid { display: flex; flex-direction: column; gap: 0.7rem; }
    .item-card {
      background: var(--c-card); border: 1px solid var(--c-border);
      border-radius: 8px; padding: 0.9rem 1.2rem;
      display: flex; align-items: center; gap: 1rem; transition: border-color 0.2s;
    }
    .item-card:hover { border-color: var(--c-border-h); }
    .item-card.inactive { opacity: 0.45; }
    .item-emoji { font-size: 1.7rem; flex-shrink: 0; }
    .item-info { flex: 1; min-width: 0; }
    .item-name { font-family: var(--f-h); font-size: 0.93rem; font-weight: 700; color: var(--c-text); }
    .item-meta { font-size: 0.78rem; color: var(--c-dim); margin-top: 0.1rem; }
    .item-price {
      font-family: var(--f-h); font-size: 0.82rem; color: var(--c-gold);
      background: rgba(200,134,28,0.08); border: 1px solid rgba(200,134,28,0.2);
      padding: 0.15rem 0.5rem; border-radius: 3px; flex-shrink: 0;
    }
    .item-actions { display: flex; gap: 0.4rem; flex-shrink: 0; }
    .btn-sm {
      padding: 0.3rem 0.65rem; border-radius: 3px; cursor: pointer;
      font-family: var(--f-h); font-size: 0.65rem; letter-spacing: 0.08em; text-transform: uppercase;
      transition: all 0.2s;
    }
    .btn-sm-edit  { background: rgba(200,134,28,0.1); border: 1px solid var(--c-gold-dim); color: var(--c-gold); }
    .btn-sm-edit:hover { background: rgba(200,134,28,0.22); }
    .btn-sm-toggle { background: rgba(68,240,112,0.08); border: 1px solid rgba(68,240,112,0.3); color: #44f070; }
    .btn-sm-toggle:hover { background: rgba(68,240,112,0.18); }
    .btn-sm-toggle.off { background: rgba(240,68,68,0.08); border-color: rgba(240,68,68,0.3); color: #f07070; }
    .btn-sm-toggle.off:hover { background: rgba(240,68,68,0.18); }
    .item-form-wrap {
      background: rgba(10,6,4,0.98); border: 1px solid var(--c-gold-dim);
      border-radius: 8px; padding: 1.5rem; margin-bottom: 1.2rem; display: none;
    }
    .item-form-wrap.open { display: block; }
    .item-form-title { font-family: var(--f-h); font-size: 0.8rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--c-gold); margin-bottom: 1.1rem; }
    .item-form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem; }
    .form-grp { display: flex; flex-direction: column; gap: 0.3rem; }
    .form-grp.full { grid-column: 1 / -1; }
    .form-lbl { font-family: var(--f-h); font-size: 0.6rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--c-dim); }
    .form-inp {
      background: rgba(255,255,255,0.04); border: 1px solid var(--c-border);
      border-radius: 4px; padding: 0.45rem 0.75rem; color: var(--c-text);
      font-size: 0.95rem; outline: none; transition: border-color 0.2s;
    }
    .form-inp:focus { border-color: var(--c-gold-dim); }
    .form-actions { display: flex; gap: 0.6rem; margin-top: 1rem; }
    .btn-save {
      padding: 0.5rem 1.2rem; background: rgba(200,134,28,0.15);
      border: 1px solid var(--c-gold-dim); border-radius: 4px;
      color: var(--c-gold); font-family: var(--f-h); font-size: 0.72rem;
      letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; transition: all 0.2s;
    }
    .btn-save:hover { background: rgba(200,134,28,0.28); }
    .btn-cancel-form {
      padding: 0.5rem 1rem; background: transparent;
      border: 1px solid var(--c-border); border-radius: 4px;
      color: var(--c-dim); font-family: var(--f-h); font-size: 0.72rem;
      letter-spacing: 0.1em; cursor: pointer; transition: all 0.2s;
    }
    .btn-cancel-form:hover { border-color: var(--c-border-h); color: var(--c-text); }
    .market-feedback {
      font-family: var(--f-h); font-size: 0.75rem; padding: 0.4rem 0.8rem;
      border-radius: 3px; margin-top: 0.6rem; display: none;
    }
    .market-feedback.ok  { display:block; color:#44f070; background:rgba(68,240,112,0.08); border:1px solid rgba(68,240,112,0.25); }
    .market-feedback.err { display:block; color:#f07070; background:rgba(240,68,68,0.08); border:1px solid rgba(240,68,68,0.25); }
  </style>
</head>
<body>
<div class="bg"></div>

<header class="site-header">
  <div class="header-inner">
    <a class="header-brand" href="/">
      <span class="brand-sub">Conan Exiles Enhanced</span>
      <span class="brand-name">Dragones y Demonios</span>
    </a>
    <button class="btn-donate-nav" onclick="window.location.href='/#donations-section'">
      <span class="donate-nav-dot"></span>
      ❤️ Donaciones
    </button>
    <nav class="header-nav">
      <a href="/" class="nav-link">Inicio</a>
      <span class="nav-link" style="color:var(--c-gold-dim);cursor:default">⚙️ Admin</span>
      <div class="auth-nav" id="auth-nav"></div>
    </nav>
  </div>
</header>

<main class="main">
  <div class="refresh-bar">
    <div class="last-refresh" id="last-refresh">–</div>
    <button class="btn-refresh" onclick="loadRequests()">↻ Actualizar</button>
  </div>

  <div class="tabs" id="tab-bar">
    <button class="tab active" onclick="setTab('clan')">⚔️ Clan <span class="badge" id="badge-clan">–</span></button>
    <button class="tab" onclick="setTab('market-req')">🪙 Pedidos <span class="badge" id="badge-market">–</span></button>
    <button class="tab" onclick="setTab('all')">📋 Todas</button>
    <button class="tab" onclick="setTab('market')">⚙️ Mercado</button>
  </div>

  <div class="section-title">
    <span id="list-title">Solicitudes de Clan</span>
    <span class="badge" id="pending-badge">–</span> pendientes
  </div>

  <div class="req-list" id="req-list">
    <div class="empty-state">Verificando sesión...</div>
  </div>

  <div id="market-panel" style="display:none">
    <div class="market-toolbar">
      <span style="font-family:var(--f-h);font-size:0.72rem;color:var(--c-dim);letter-spacing:0.08em">ÍTEMS EN EL MERCADO</span>
      <button class="btn-add-item" onclick="openItemForm(null)">+ Agregar Ítem</button>
    </div>

    <div class="item-form-wrap" id="item-form-wrap">
      <div class="item-form-title" id="item-form-title">Nuevo Ítem</div>
      <div class="item-form-grid">
        <div class="form-grp">
          <label class="form-lbl" for="if-name">Nombre *</label>
          <input class="form-inp" type="text" id="if-name" maxlength="80" placeholder="Ej: Espada de Hierro">
        </div>
        <div class="form-grp">
          <label class="form-lbl" for="if-emoji">Emoji</label>
          <input class="form-inp" type="text" id="if-emoji" maxlength="4" placeholder="⚔️">
        </div>
        <div class="form-grp full">
          <label class="form-lbl" for="if-desc">Descripción *</label>
          <input class="form-inp" type="text" id="if-desc" maxlength="200" placeholder="Descripción breve del ítem">
        </div>
        <div class="form-grp">
          <label class="form-lbl" for="if-cat">Categoría</label>
          <input class="form-inp" type="text" id="if-cat" maxlength="40" placeholder="Armas">
        </div>
        <div class="form-grp">
          <label class="form-lbl" for="if-cost">Costo Pippi 🪙</label>
          <input class="form-inp" type="number" id="if-cost" min="0" placeholder="50">
        </div>
        <div class="form-grp">
          <label class="form-lbl" for="if-template">Template ID (Pippi)</label>
          <input class="form-inp" type="text" id="if-template" maxlength="40" placeholder="11001">
        </div>
        <div class="form-grp">
          <label class="form-lbl" for="if-order">Orden visual</label>
          <input class="form-inp" type="number" id="if-order" min="0" placeholder="0">
        </div>
      </div>
      <div class="form-actions">
        <button class="btn-save" onclick="saveItem()">💾 Guardar</button>
        <button class="btn-cancel-form" onclick="closeItemForm()">Cancelar</button>
      </div>
      <div class="market-feedback" id="item-form-feedback"></div>
    </div>

    <div class="item-grid" id="item-grid">
      <div class="empty-state">Cargando ítems...</div>
    </div>
  </div>
</main>

<script src="config.js"></script>
<script>
(function () {
  'use strict';

  let sbClient      = null;
  let allRequests   = [];
  let currentTab    = 'clan';
  let editingItemId = null;
  const ADMIN_EMAIL = 'datawebgames@gmail.com';

  function esc(s) {
    return String(s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function fmtDate(ts) {
    if (!ts) return '–';
    return new Date(ts).toLocaleString('es-AR', {
      day:'2-digit', month:'2-digit', year:'numeric',
      hour:'2-digit', minute:'2-digit'
    });
  }
  function statusPill(status) {
    const map = {
      pending:   ['pill-pending',   '● Pendiente'],
      approved:  ['pill-approved',  '✓ Aprobado'],
      rejected:  ['pill-rejected',  '✕ Rechazado'],
      delivered: ['pill-delivered', '✓ Entregado'],
    };
    const [cls, label] = map[status] || ['pill-pending', status];
    return `<span class="req-status-pill ${cls}">${label}</span>`;
  }

  // ── Auth ──────────────────────────────────────────────
  function initAdmin() {
    if (!window.SUPABASE_URL || !window.SUPABASE_ANON || !window.supabase) {
      document.getElementById('req-list').innerHTML =
        '<div class="empty-state">⚠️ Supabase no configurado.</div>';
      return;
    }
    sbClient = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON);
    sbClient.auth.getSession().then(({ data }) => {
      const user = data.session?.user;
      updateAuthNav(user);
      if (!user || user.email !== ADMIN_EMAIL) {
        document.getElementById('req-list').innerHTML =
          '<div class="empty-state">⚠️ Acceso denegado. <a href="/" style="color:var(--c-gold)">Iniciá sesión como admin</a></div>';
        return;
      }
      loadRequests();
      setInterval(loadRequests, 30_000);
    });
    sbClient.auth.onAuthStateChange((_e, session) => {
      updateAuthNav(session?.user ?? null);
    });
  }

  function updateAuthNav(user) {
    const el = document.getElementById('auth-nav');
    if (!el) return;
    if (user) {
      const name = user.user_metadata?.char_name || user.email;
      el.innerHTML = `
        <a href="profile.html" class="nav-link nav-register">👤 ${esc(name)}</a>
        <a href="#" class="nav-link" onclick="doAdminLogout()">Salir</a>`;
    } else {
      el.innerHTML = `<a href="/" class="nav-link nav-register">Volver</a>`;
    }
  }

  // ── Tabs ──────────────────────────────────────────────
  function setTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.tab').forEach((el, i) => {
      el.classList.toggle('active', ['clan','market-req','all','market'][i] === tab);
    });
    const titles = {
      clan:          'Solicitudes de Clan',
      'market-req':  'Pedidos del Mercado',
      all:           'Todas las Solicitudes',
      market:        'Gestión del Mercado Pippi',
    };
    document.getElementById('list-title').textContent = titles[tab] || tab;
    const isMarket = tab === 'market';
    document.getElementById('req-list').style.display     = isMarket ? 'none' : '';
    document.getElementById('market-panel').style.display = isMarket ? ''     : 'none';
    if (isMarket) {
      loadMarketItems();
    } else {
      renderList();
    }
  }

  // ── Requests ──────────────────────────────────────────
  function renderList() {
    const list    = document.getElementById('req-list');
    const typeMap = { clan: 'clan', 'market-req': 'market' };
    const filtered = currentTab === 'all'
      ? allRequests
      : allRequests.filter(r => r.type === (typeMap[currentTab] || currentTab));

    const pending = filtered.filter(r => r.status === 'pending').length;
    document.getElementById('pending-badge').textContent = pending;

    if (!filtered.length) {
      list.innerHTML = '<div class="empty-state">No hay solicitudes en esta categoría.</div>';
      return;
    }

    list.innerHTML = filtered.map(r => {
      const isPending = r.status === 'pending';
      const icon      = r.type === 'clan' ? '⚔️' : '🪙';
      const subject   = r.type === 'clan'
        ? 'Quiere unirse al clan'
        : `Pidió: <strong style="color:var(--c-text)">${esc(r.itemName || r.itemId || '?')}</strong>`;
      const msgBlock  = r.message ? `<div class="req-msg">"${esc(r.message)}"</div>` : '';

      let actions = '';
      if (r.type === 'clan' && isPending) {
        actions = `
          <button class="btn-approve" onclick="approve(${r.id}, this)">✓ Aprobar</button>
          <button class="btn-reject"  onclick="reject(${r.id},  this)">✕ Rechazar</button>`;
      } else if (r.type === 'market' && isPending) {
        actions = `
          <button class="btn-deliver" onclick="deliver(${r.id}, this)">📦 Aprobar entrega</button>
          <button class="btn-reject"  onclick="reject(${r.id},  this)">✕ Rechazar</button>`;
      } else if (r.type === 'market' && (r.status === 'delivered' || r.status === 'approved')) {
        actions = `<button class="btn-secondary-sm" onclick="retry(${r.id}, this)">↩ Reintentar</button>`;
      }

      const rconBlock = r.rconNote
        ? `<div class="req-rcon" title="Respuesta RCON">🔧 ${esc(r.rconNote)}</div>` : '';

      return `
        <div class="req-card ${r.status}" id="req-${r.id}">
          <div class="req-type-icon">${icon}</div>
          <div class="req-body">
            <div class="req-name">${esc(r.characterName)} ${statusPill(r.status)}</div>
            <div class="req-meta">${subject} · ${fmtDate(r.ts)}</div>
            ${msgBlock}
            ${rconBlock}
          </div>
          <div class="req-actions">
            ${actions}
            <div class="req-feedback" id="fb-${r.id}"></div>
          </div>
        </div>`;
    }).join('');
  }

  async function loadRequests() {
    try {
      const { data, error } = await sbClient.from('requests')
        .select('*').order('created_at', { ascending: false });
      if (error) throw error;
      allRequests = (data || []).map(r => ({
        id:            r.id,
        type:          r.type,
        characterName: r.character_name,
        itemId:        r.item_id,
        itemName:      r.item_name,
        pippiCost:     r.pippi_cost,
        message:       r.message,
        status:        r.status,
        rconNote:      r.rcon_note,
        ts:            r.created_at,
      }));

      const pClan   = allRequests.filter(r => r.type === 'clan'   && r.status === 'pending').length;
      const pMarket = allRequests.filter(r => r.type === 'market' && r.status === 'pending').length;
      document.getElementById('badge-clan').textContent   = pClan   || '–';
      document.getElementById('badge-market').textContent = pMarket || '–';
      document.getElementById('last-refresh').textContent =
        'Actualizado: ' + new Date().toLocaleTimeString('es-AR', { hour:'2-digit', minute:'2-digit', second:'2-digit' });

      if (currentTab !== 'market') renderList();
    } catch (e) {
      document.getElementById('req-list').innerHTML =
        `<div class="empty-state">⚠️ ${esc(e.message || 'Error al cargar.')}</div>`;
    }
  }

  async function approve(id, btn) {
    const fb = document.getElementById(`fb-${id}`);
    btn.disabled = true; btn.textContent = 'Aprobando...';
    const sibling = btn.nextElementSibling;
    if (sibling) sibling.disabled = true;
    try {
      const { error } = await sbClient.from('requests')
        .update({ status: 'approved', processed_at: new Date().toISOString() }).eq('id', id);
      if (error) throw error;
      fb.className = 'req-feedback ok'; fb.textContent = '¡Aprobado!';
      document.getElementById(`req-${id}`).className = 'req-card approved';
      btn.remove(); if (sibling) sibling.remove();
      setTimeout(loadRequests, 1200);
    } catch (e) {
      fb.className = 'req-feedback err'; fb.textContent = e.message || 'Error.';
      btn.disabled = false; btn.textContent = '✓ Aprobar';
      if (sibling) sibling.disabled = false;
    }
  }

  async function reject(id, btn) {
    if (!confirm('¿Rechazar esta solicitud?')) return;
    btn.disabled = true; btn.textContent = 'Rechazando...';
    const sibling = btn.previousElementSibling;
    if (sibling) sibling.disabled = true;
    try {
      const { error } = await sbClient.from('requests')
        .update({ status: 'rejected', processed_at: new Date().toISOString() }).eq('id', id);
      if (error) throw error;
      document.getElementById(`req-${id}`).className = 'req-card rejected';
      btn.remove(); if (sibling) sibling.remove();
      setTimeout(loadRequests, 1200);
    } catch {
      btn.disabled = false; btn.textContent = '✕ Rechazar';
      if (sibling) sibling.disabled = false;
    }
  }

  async function deliver(id, btn) {
    const fb = document.getElementById(`fb-${id}`);
    btn.disabled = true; btn.textContent = 'Aprobando...';
    const sibling = btn.nextElementSibling;
    if (sibling) sibling.disabled = true;
    try {
      const { error } = await sbClient.from('requests')
        .update({ status: 'approved' }).eq('id', id);
      if (error) throw error;
      document.getElementById(`req-${id}`).className = 'req-card approved';
      btn.remove(); if (sibling) sibling.remove();
      if (fb) { fb.className = 'req-feedback ok'; fb.textContent = 'Aprobado. El bridge entregará el ítem automáticamente cuando el jugador esté online.'; }
      setTimeout(loadRequests, 3000);
    } catch (e) {
      fb.className = 'req-feedback err'; fb.textContent = e.message || 'Error.';
      btn.disabled = false; btn.textContent = '📦 Dar ítem';
      if (sibling) sibling.disabled = false;
    }
  }

  async function retry(id, btn) {
    const fb = document.getElementById(`fb-${id}`);
    btn.disabled = true; btn.textContent = 'Reintentando...';
    try {
      const { error } = await sbClient.from('requests')
        .update({ status: 'approved', rcon_note: null }).eq('id', id);
      if (error) throw error;
      if (fb) { fb.className = 'req-feedback ok'; fb.textContent = 'Reintento enviado. El bridge lo entregará cuando el jugador esté online.'; }
      setTimeout(loadRequests, 3000);
    } catch (e) {
      if (fb) { fb.className = 'req-feedback err'; fb.textContent = e.message || 'Error.'; }
      btn.disabled = false; btn.textContent = '↩ Reintentar';
    }
  }

  // ── Market management ─────────────────────────────────
  async function loadMarketItems() {
    const grid = document.getElementById('item-grid');
    grid.innerHTML = '<div class="empty-state">Cargando...</div>';
    try {
      const { data, error } = await sbClient.from('market_items')
        .select('*').order('sort_order');
      if (error) throw error;
      renderMarketItems(data || []);
    } catch (e) {
      grid.innerHTML = `<div class="empty-state">⚠️ ${esc(e.message || 'Error al cargar.')}</div>`;
    }
  }

  function renderMarketItems(items) {
    const grid = document.getElementById('item-grid');
    if (!items.length) {
      grid.innerHTML = '<div class="empty-state">No hay ítems. Agregá el primero.</div>';
      return;
    }
    grid.innerHTML = items.map(item => `
      <div class="item-card${item.active ? '' : ' inactive'}" id="mc-${item.id}">
        <div class="item-emoji">${item.emoji || '📦'}</div>
        <div class="item-info">
          <div class="item-name">${esc(item.name)}</div>
          <div class="item-meta">${esc(item.category)} · Template: ${esc(item.template_id || '–')} · ${item.active ? '✓ Activo' : '✕ Inactivo'}</div>
        </div>
        <div class="item-price">🪙 ${item.pippi_cost}</div>
        <div class="item-actions">
          <button class="btn-sm btn-sm-edit"
            onclick='openItemForm(${JSON.stringify(item).replace(/'/g,"&#39;")})'>✎ Editar</button>
          <button class="btn-sm btn-sm-toggle${item.active ? '' : ' off'}"
            onclick="toggleItem(${item.id}, ${item.active}, this)">
            ${item.active ? '✓ Activo' : '✕ Inactivo'}
          </button>
        </div>
      </div>`).join('');
  }

  function openItemForm(item) {
    editingItemId = item ? item.id : null;
    document.getElementById('item-form-title').textContent = item ? 'Editar Ítem' : 'Nuevo Ítem';
    document.getElementById('if-name').value     = item?.name        ?? '';
    document.getElementById('if-emoji').value    = item?.emoji       ?? '📦';
    document.getElementById('if-desc').value     = item?.description ?? '';
    document.getElementById('if-cat').value      = item?.category    ?? 'General';
    document.getElementById('if-cost').value     = item?.pippi_cost  ?? 0;
    document.getElementById('if-template').value = item?.template_id ?? '';
    document.getElementById('if-order').value    = item?.sort_order  ?? 0;
    const fb = document.getElementById('item-form-feedback');
    fb.className = 'market-feedback'; fb.textContent = '';
    document.getElementById('item-form-wrap').classList.add('open');
    document.getElementById('if-name').focus();
  }

  function closeItemForm() {
    document.getElementById('item-form-wrap').classList.remove('open');
    editingItemId = null;
  }

  async function saveItem() {
    const fb  = document.getElementById('item-form-feedback');
    const btn = document.querySelector('#item-form-wrap .btn-save');
    const name = document.getElementById('if-name').value.trim();
    const desc = document.getElementById('if-desc').value.trim();
    if (!name || !desc) {
      fb.className = 'market-feedback err';
      fb.textContent = 'Nombre y descripción son obligatorios.';
      return;
    }
    const body = {
      name, description: desc,
      emoji:       document.getElementById('if-emoji').value.trim()    || '📦',
      category:    document.getElementById('if-cat').value.trim()      || 'General',
      pippi_cost:  parseInt(document.getElementById('if-cost').value)  || 0,
      template_id: document.getElementById('if-template').value.trim() || null,
      sort_order:  parseInt(document.getElementById('if-order').value) || 0,
    };
    const origText = btn.textContent;
    btn.disabled = true; btn.textContent = 'Guardando...';
    try {
      const { error } = editingItemId
        ? await sbClient.from('market_items').update(body).eq('id', editingItemId)
        : await sbClient.from('market_items').insert(body);
      if (error) throw error;
      fb.className = 'market-feedback ok';
      fb.textContent = editingItemId ? 'Ítem actualizado.' : 'Ítem creado.';
      setTimeout(() => { closeItemForm(); loadMarketItems(); }, 1200);
    } catch (e) {
      fb.className = 'market-feedback err';
      fb.textContent = e.message || 'Error al guardar.';
    }
    btn.disabled = false; btn.textContent = origText;
  }

  async function toggleItem(id, currentlyActive, btn) {
    btn.disabled = true;
    try {
      const { error } = await sbClient.from('market_items')
        .update({ active: !currentlyActive }).eq('id', id);
      if (!error) loadMarketItems();
      else btn.disabled = false;
    } catch { btn.disabled = false; }
  }

  window.setTab        = setTab;
  window.approve       = approve;
  window.reject        = reject;
  window.deliver       = deliver;
  window.loadRequests  = loadRequests;
  window.retry         = retry;
  window.openItemForm  = openItemForm;
  window.closeItemForm = closeItemForm;
  window.saveItem      = saveItem;
  window.toggleItem    = toggleItem;
  window.doAdminLogout = function () { sbClient && sbClient.auth.signOut().then(() => location.href = '/'); };

  initAdmin();
})();
</script>
</body>
</html>
