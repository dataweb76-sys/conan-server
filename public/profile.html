<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Perfil · Dragones y Demonios</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cinzel:wght@400;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <link rel="stylesheet" href="style.css">
  <style>
    .profile-main {
      min-height: calc(100vh - 64px);
      display: flex; align-items: center; justify-content: center;
      padding: 3rem 1rem;
    }
    .profile-wrap { width: 100%; max-width: 520px; }
    .profile-card {
      background: rgba(10,6,4,0.97); border: 1px solid var(--c-border);
      border-radius: 12px; padding: 2.2rem; margin-bottom: 1rem;
      box-shadow: 0 12px 60px rgba(0,0,0,0.6);
    }
    .profile-card-title {
      font-family: var(--f-heading); font-size: 0.72rem;
      letter-spacing: 0.25em; text-transform: uppercase;
      color: var(--c-gold-dim); margin-bottom: 1.6rem;
      padding-bottom: 0.65rem; border-bottom: 1px solid var(--c-border);
    }
    .profile-avatar-row {
      display: flex; align-items: center; gap: 1.2rem; margin-bottom: 1.6rem;
    }
    .profile-avatar {
      width: 64px; height: 64px; border-radius: 50%; flex-shrink: 0;
      background: linear-gradient(135deg, #7a3a00, #c07010);
      display: flex; align-items: center; justify-content: center;
      font-family: var(--f-display); font-weight: 900; font-size: 1.6rem;
      color: rgba(255,255,255,0.85);
      box-shadow: 0 4px 20px rgba(180,80,0,0.4);
    }
    .profile-id-info { flex: 1; min-width: 0; }
    .profile-email {
      font-family: var(--f-heading); font-size: 0.72rem;
      color: var(--c-text-dim); letter-spacing: 0.06em;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .profile-charname {
      font-family: var(--f-display); font-size: 1.1rem;
      color: var(--c-gold-light); text-shadow: var(--glow-gold);
      margin-top: 0.25rem;
    }
    .profile-stats-row {
      display: flex; gap: 0; margin-bottom: 1.8rem;
      background: rgba(200,134,28,0.04); border: 1px solid var(--c-border);
      border-radius: 6px; overflow: hidden;
    }
    .pstat {
      flex: 1; display: flex; flex-direction: column; align-items: center;
      padding: 0.8rem 0.5rem;
    }
    .pstat-div { width: 1px; background: var(--c-border); }
    .pstat-val {
      font-family: var(--f-display); font-size: 1.3rem;
      color: var(--c-gold-light); line-height: 1; text-shadow: var(--glow-gold);
    }
    .pstat-label {
      font-family: var(--f-heading); font-size: 0.55rem;
      letter-spacing: 0.15em; text-transform: uppercase;
      color: var(--c-text-dim); margin-top: 0.2rem;
    }
    .profile-note {
      font-size: 0.9rem; color: var(--c-text-dim); font-style: italic;
      margin-bottom: 1.5rem; text-align: center;
    }
    .profile-edit-row {
      display: flex; gap: 0.6rem; margin-top: 0.4rem;
    }
    .profile-edit-row .form-input { flex: 1; }
    .profile-edit-row .btn-join { white-space: nowrap; font-size: 0.78rem; padding: 0.6rem 1rem; }
    .profile-actions {
      margin-top: 1.5rem; padding-top: 1.2rem;
      border-top: 1px solid var(--c-border);
      display: flex; justify-content: flex-end;
    }
  </style>
</head>
<body>

<div class="bg-wrap">
  <div class="bg-img"></div>
  <div class="bg-overlay"></div>
</div>

<header class="site-header">
  <div class="header-inner container">
    <a class="header-brand" href="/">
      <span class="brand-sub">Conan Exiles Enhanced</span>
      <span class="brand-name">Dragones y Demonios</span>
    </a>
    <button class="btn-donate-nav" onclick="window.location.href='/#donations-section'">
      <span class="donate-nav-dot"></span>
      ❤️ Donaciones
    </button>
    <nav class="header-nav">
      <a href="/" class="nav-link">Inicio</a>
      <div class="auth-nav" id="auth-nav"></div>
    </nav>
  </div>
</header>

<main class="profile-main">
  <div class="profile-wrap">
    <div class="profile-card" id="profile-card">
      <div class="profile-card-title">Mi Perfil</div>
      <div class="pg-loading" style="display:flex;gap:1rem;padding:2rem 0">
        <div class="spinner"></div><span>Cargando...</span>
      </div>
    </div>
  </div>
</main>

<script src="config.js"></script>
<script>
(function () {
  'use strict';

  const API_BASE = window.API_BASE || '';
  let sb = null;

  async function init() {
    if (!window.SUPABASE_URL || !window.SUPABASE_ANON || !window.supabase) {
      showError('Supabase no configurado. Completá <code>config.js</code>.');
      return;
    }
    sb = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON);
    const { data } = await sb.auth.getSession();
    if (!data.session) {
      showError('No estás logueado. <a href="/" style="color:var(--c-gold)">Ir al inicio</a>');
      updateAuthNav(null);
      return;
    }
    updateAuthNav(data.session.user);
    loadProfile(data.session.user);
  }

  function updateAuthNav(user) {
    const el = document.getElementById('auth-nav');
    if (!el) return;
    if (user) {
      el.innerHTML = `
        <span class="nav-link" style="color:var(--c-gold-dim);cursor:default">👤 Mi Perfil</span>
        <a href="#" class="nav-link" onclick="doLogout();return false;">Salir</a>`;
    } else {
      el.innerHTML = `<a href="/" class="nav-link nav-register">Registrarse</a>`;
    }
  }

  async function loadProfile(user) {
    const card = document.getElementById('profile-card');

    const { data: profile } = await sb.from('profiles').select('*').eq('id', user.id).maybeSingle();
    const charName = profile?.char_name || '';
    const initial  = (charName || user.email)[0].toUpperCase();

    let gameStats = null;
    if (charName) {
      try {
        const r  = await fetch(API_BASE + '/api/ranking');
        const rd = await r.json();
        if (rd?.players) {
          gameStats = rd.players.find(
            p => p.name.toLowerCase() === charName.toLowerCase()
          );
        }
      } catch { /* non-critical */ }
    }

    const statsHtml = gameStats ? `
      <div class="profile-stats-row">
        <div class="pstat">
          <div class="pstat-val">${gameStats.level}</div>
          <div class="pstat-label">Nivel</div>
        </div>
        <div class="pstat-div"></div>
        <div class="pstat">
          <div class="pstat-val" style="font-size:.9rem">${gameStats.clan || '–'}</div>
          <div class="pstat-label">Clan</div>
        </div>
        <div class="pstat-div"></div>
        <div class="pstat">
          <div class="pstat-val">${gameStats.online ? '🟢' : '⚫'}</div>
          <div class="pstat-label">Estado</div>
        </div>
      </div>` : (charName
        ? '<p class="profile-note">Personaje aún no encontrado en el servidor.</p>'
        : '<p class="profile-note">Vinculá tu personaje del juego para ver tus estadísticas.</p>'
      );

    card.innerHTML = `
      <div class="profile-card-title">Mi Perfil</div>
      <div class="profile-avatar-row">
        <div class="profile-avatar">${initial}</div>
        <div class="profile-id-info">
          <div class="profile-email">${user.email}</div>
          <div class="profile-charname">${charName ? `⚔️ ${charName}` : 'Sin personaje vinculado'}</div>
        </div>
      </div>
      ${statsHtml}
      <div class="form-group">
        <label class="form-label" for="edit-charname">Personaje en el juego</label>
        <div class="profile-edit-row">
          <input class="form-input" type="text" id="edit-charname"
            value="${charName}" placeholder="Nombre exacto en Conan Exiles" maxlength="40">
          <button class="btn-join" onclick="saveCharName('${user.id}')">Guardar</button>
        </div>
        <div class="form-feedback" id="edit-feedback"></div>
      </div>
      <div class="profile-actions">
        <button class="btn-secondary" onclick="doLogout()">Cerrar sesión</button>
      </div>`;
  }

  window.saveCharName = async function (userId) {
    const charName = document.getElementById('edit-charname').value.trim();
    const fb = document.getElementById('edit-feedback');
    if (!charName) { fb.className = 'form-feedback err'; fb.textContent = 'Ingresá un nombre.'; return; }
    const { error } = await sb.from('profiles').upsert({ id: userId, char_name: charName });
    if (error) {
      fb.className = 'form-feedback err'; fb.textContent = error.message;
    } else {
      fb.className = 'form-feedback ok'; fb.textContent = '¡Guardado! Recargá para ver tus stats.';
    }
  };

  window.doLogout = async function () {
    await sb.auth.signOut();
    window.location.href = '/';
  };

  function showError(html) {
    document.getElementById('profile-card').innerHTML =
      `<div class="profile-card-title">Mi Perfil</div>
       <p class="profile-note" style="padding:2rem 0">${html}</p>`;
  }

  init();
})();
</script>
</body>
</html>
